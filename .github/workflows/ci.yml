name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  web:
    name: Web app
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub Pages serves the site at https://<owner>.github.io/<repo>/
      EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx expo export --platform web

      - name: Make it installable and offline-ready
        run: node scripts/finish-web-build.mjs dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-web:
    name: Deploy web app to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages has to be switched on once by hand; until then, skip with a hint instead of failing.
      - name: Check that GitHub Pages is switched on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Web app not published yet::Turn on GitHub Pages once: repo Settings → Pages → Build and deployment → Source: GitHub Actions. Then re-run this workflow."
          fi

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # publish the APK as a GitHub release on pushes to main
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      # android/ is generated from app.json (Continuous Native Generation), never committed.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Release build with the JS bundle inside, so it runs without a dev server.
      # It is signed with the template's debug key, which is fine for installing on your own phone
      # but not for the Play Store. arm64-v8a covers practically every Android phone from the last
      # ~8 years; add armeabi-v7a (comma-separated) for very old 32-bit phones.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk court-ready.apk

      - uses: actions/upload-artifact@v5
        with:
          name: court-ready-apk
          path: court-ready.apk
          if-no-files-found: error

      # Keeps one release, "android-latest", always pointing at the newest build on main, so the
      # phone download link never changes:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/court-ready.apk
      - name: Publish the "android-latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest court-ready.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Android app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on main. On your Android phone, download court-ready.apk and open it to install (allow installs from your browser when asked). Installing a newer build over an older one keeps your workouts."
